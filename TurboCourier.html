<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Turbo Courier</title>
<!--
  TURBO COURIER — a single-file, fully-offline top-down driving game.
  No frameworks, no CDNs, no fonts, no images, no audio files, no network calls.

  You're the fastest courier in the city. Drive to the flashing JOB marker
  to take a mission, then beat the clock:
    PACKAGE — one dropoff · TAXI — take the fare across town ·
    RUSH — hit 3 checkpoints in order.
  Consecutive successes build a pay streak; failing resets it. Spend cash
  in the GARAGE on Engine (speed), Grip (steering) and Turbo (boost) —
  upgrades persist between sessions.

  Controls:
    Mobile  : the car drives itself — hold LEFT / RIGHT side to steer,
              tap the TURBO button for boost.
    Desktop : ← → / A D steer · ↓ / S brake+reverse · SPACE turbo · M mute
  Saves:  cash, upgrades, jobs done and best streak in localStorage.
-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #15171c;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #boot {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    color: #ffd9a8; background: #15171c;
    font: 500 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  #boot b { color: #ffffff; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="boot">
  <div>
    <b>TURBO COURIER</b><br><br>
    If this message stays on screen, this viewer has JavaScript disabled
    (in-app file previews often do).<br><br>
    <b>Save the file</b> to your device, then open it in a real browser
    (Safari, Chrome, Firefox, Edge) &mdash; it works fully offline.
  </div>
</div>
<script>
window.onerror = function (msg, src, line) {
  var el = document.getElementById('boot');
  if (!el) { el = document.createElement('div'); el.id = 'boot'; document.body.appendChild(el); }
  el.innerHTML = '<div><b>TURBO COURIER hit an error</b><br><br>' + String(msg) +
    (line ? ' (line ' + line + ')' : '') + '<br><br>Please report this with your browser + device.</div>';
  return false;
};
</script>
<script>
'use strict';
/* ============================================================
   SECTION 1 — CONSTANTS, STATE, PERSISTENCE
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

const T = 42;                        // tile size, px (world units are px)
const MCOLS = 28, MROWS = 36;        // city size in tiles
const WORLD_W = MCOLS * T, WORLD_H = MROWS * T;
const BLOCK = 4;                     // street every 4th tile

const UPGRADES = [
  { id: 'eng',   name: 'ENGINE', desc: 'top speed',  costs: [300, 700, 1400] },
  { id: 'grip',  name: 'GRIP',   desc: 'steering',   costs: [250, 600, 1200] },
  { id: 'turbo', name: 'TURBO',  desc: 'boost time', costs: [250, 600, 1200] },
];
const JOB_TYPES = [
  { id: 'package', name: 'PACKAGE', flavor: 'deliver the parcel', hue: 35,  targets: 1 },
  { id: 'taxi',    name: 'TAXI',    flavor: 'take the fare home', hue: 55,  targets: 1 },
  { id: 'rush',    name: 'RUSH',    flavor: 'hit every checkpoint', hue: 320, targets: 3 },
];

let W = 0, H = 0, DPR = 1;
let state = 'title';                 // title | playing | garage | paused
let lastFrame = 0, animT = 0;

// world / run state
let map, car, camX = 0, camY = 0, shake = 0;
let job = null;                      // null | {phase:'pickup'|'run', type, targets:[{x,y}], ti, timer, timeMax, reward}
let jobsDone, streak, level;
let skids, parts, floats, banner;
let turbo = 1, turboOn = false;

// persistent profile
let cash = 0, up = { eng: 0, grip: 0, turbo: 0 }, totalJobs = 0, bestStreak = 0;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
};
let muted = store.get('tc_mute', '0') === '1';
function loadProfile() {
  try {
    const s = JSON.parse(store.get('tc_save', '{}'));
    const u = s.up || {};
    cash = s.cash | 0;
    up = { eng: clamp(u.eng | 0, 0, 3), grip: clamp(u.grip | 0, 0, 3), turbo: clamp(u.turbo | 0, 0, 3) };
    totalJobs = s.totalJobs | 0;
    bestStreak = s.bestStreak | 0;
  } catch (e) { /* fresh profile */ }
}
function saveProfile() {
  store.set('tc_save', JSON.stringify({ cash: Math.round(cash), up, totalJobs, bestStreak }));
}

/* ============================================================
   SECTION 2 — UTILITIES
   ============================================================ */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => (a + Math.random() * (b - a + 1)) | 0;
function hsl(h, s, l, a) { return a === undefined ? `hsl(${h},${s}%,${l}%)` : `hsla(${h},${s}%,${l}%,${a})`; }
function font(s, bold) { return `${bold ? '800' : '500'} ${s}px system-ui, -apple-system, 'Segoe UI', sans-serif`; }
function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================
   SECTION 3 — AUDIO (synthesized; includes a live engine loop)
   ============================================================ */
let AC = null, masterGain = null, engOsc = null, engGain = null, engFlt = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  AC = new Ctor();
  masterGain = AC.createGain();
  masterGain.gain.value = muted ? 0 : 0.45;
  masterGain.connect(AC.destination);
}
function engineStart() {
  if (!AC || engOsc) return;
  engOsc = AC.createOscillator();
  engOsc.type = 'sawtooth';
  engOsc.frequency.value = 60;
  engFlt = AC.createBiquadFilter(); engFlt.type = 'lowpass'; engFlt.frequency.value = 420;
  engGain = AC.createGain(); engGain.gain.value = 0;
  engOsc.connect(engFlt); engFlt.connect(engGain); engGain.connect(masterGain);
  engOsc.start();
}
function engineUpdate(v, vmax, boosting) {
  if (!engGain) return;
  const on = state === 'playing';
  engGain.gain.value = on ? 0.035 + Math.abs(v) / vmax * 0.03 : 0;
  engOsc.frequency.value = 55 + Math.abs(v) / vmax * (boosting ? 220 : 150);
}
function setMuted(m) {
  muted = m;
  store.set('tc_mute', m ? '1' : '0');
  if (masterGain) masterGain.gain.value = m ? 0 : 0.45;
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + Math.max(0, delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol, f0, f1) {
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  const len = Math.max(1, (dur * AC.sampleRate) | 0);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const flt = AC.createBiquadFilter(); flt.type = 'lowpass';
  flt.frequency.setValueAtTime(f0, t0);
  flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(flt); flt.connect(g); g.connect(masterGain);
  src.start(t0);
}
const sfx = {
  pickup()  { tone(660, 990, 0.12, 'triangle', 0.22); tone(990, 1320, 0.14, 'triangle', 0.18, 0.1); },
  check()   { tone(880, 1100, 0.08, 'square', 0.15); },
  deliver() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.18, 'triangle', 0.2, i * 0.1)); },
  fail()    { tone(300, 150, 0.4, 'sawtooth', 0.25); tone(220, 110, 0.4, 'sawtooth', 0.18, 0.1); },
  crash()   { noiseBurst(0.22, 0.3, 1200, 150); tone(120, 50, 0.2, 'square', 0.25); },
  skid()    { noiseBurst(0.12, 0.08, 3200, 900); },
  turbo()   { tone(200, 700, 0.3, 'sawtooth', 0.15); noiseBurst(0.25, 0.1, 2500, 900); },
  buy()     { tone(700, 700, 0.08, 'triangle', 0.2); tone(1050, 1050, 0.12, 'triangle', 0.18, 0.07); },
  deny()    { tone(160, 120, 0.12, 'square', 0.16); },
  select()  { tone(600, 780, 0.05, 'square', 0.1); },
};

/* ============================================================
   SECTION 4 — CITY GENERATION
   ============================================================ */
// tile codes: 0 road · 1 building · 2 park · 3 water
let blockHue;   // per-block colour seed for buildings
function genCity() {
  map = [];
  blockHue = [];
  for (let r = 0; r < MROWS; r++) {
    map[r] = [];
    for (let c = 0; c < MCOLS; c++) {
      map[r][c] = (r % BLOCK === 0 || c % BLOCK === 0 || r === MROWS - 1 || c === MCOLS - 1) ? 0 : 1;
    }
  }
  // some blocks become parks or lakes
  for (let br = 0; br < MROWS / BLOCK; br++) {
    blockHue[br] = [];
    for (let bc = 0; bc < MCOLS / BLOCK; bc++) {
      blockHue[br][bc] = rndi(0, 360);
      const roll = Math.random();
      const t = roll < 0.12 ? 2 : roll < 0.18 ? 3 : 1;
      if (t !== 1) {
        for (let r = br * BLOCK + 1; r < (br + 1) * BLOCK && r < MROWS - 1; r++)
          for (let c = bc * BLOCK + 1; c < (bc + 1) * BLOCK && c < MCOLS - 1; c++)
            map[r][c] = t;
      }
    }
  }
  buildMinimap();
}
function tileAt(x, y) {
  const c = Math.floor(x / T), r = Math.floor(y / T);
  if (!(r >= 0 && r < MROWS && c >= 0 && c < MCOLS)) return 1;   // walls outside (NaN-safe)
  return map[r][c];
}
function randomRoadPoint(awayX, awayY, minTiles) {
  for (let i = 0; i < 400; i++) {
    const r = rndi(0, MROWS - 1), c = rndi(0, MCOLS - 1);
    if (map[r][c] !== 0) continue;
    const x = (c + 0.5) * T, y = (r + 0.5) * T;
    if (Math.abs(x - awayX) + Math.abs(y - awayY) > minTiles * T) return { x, y };
  }
  return { x: T * 2.5, y: T * 0.5 };
}

// prerendered minimap (roads never change)
let miniCanvas = null;
const MINI_SCALE = 3;
function buildMinimap() {
  miniCanvas = document.createElement('canvas');
  miniCanvas.width = MCOLS * MINI_SCALE; miniCanvas.height = MROWS * MINI_SCALE;
  const g = miniCanvas.getContext('2d');
  g.fillStyle = 'rgba(10,12,16,0.85)';
  g.fillRect(0, 0, miniCanvas.width, miniCanvas.height);
  for (let r = 0; r < MROWS; r++) for (let c = 0; c < MCOLS; c++) {
    if (map[r][c] === 0) g.fillStyle = 'rgba(220,230,240,0.6)';
    else if (map[r][c] === 2) g.fillStyle = 'rgba(60,140,70,0.5)';
    else if (map[r][c] === 3) g.fillStyle = 'rgba(50,110,170,0.5)';
    else continue;
    g.fillRect(c * MINI_SCALE, r * MINI_SCALE, MINI_SCALE, MINI_SCALE);
  }
}

/* ============================================================
   SECTION 5 — CAR PHYSICS
   ============================================================ */
function carStats() {
  return {
    vmax: 250 + up.eng * 55,
    accel: 300 + up.eng * 40,
    steer: 2.5 + up.grip * 0.45,
    turboMax: 1 + up.turbo * 0.5,        // seconds of boost
  };
}
function resetCar() {
  // start on a road near the map centre
  const p = randomRoadPoint(-9999, -9999, 0);
  car = { x: p.x, y: p.y, a: 0, v: 0 };
  turbo = 1;
}
function updateCar(dt) {
  const st = carStats();
  const boosting = turboOn && turbo > 0;
  if (boosting) turbo = Math.max(0, turbo - dt / st.turboMax);
  else turbo = Math.min(1, turbo + dt * 0.12);
  const vmax = st.vmax * (boosting ? 1.55 : 1);
  const offroad = tileAt(car.x, car.y) === 2;

  // auto-throttle (brake/reverse on demand)
  const braking = keys.ArrowDown || keys.KeyS;
  if (braking) car.v -= st.accel * 1.4 * dt;
  else car.v += st.accel * (boosting ? 1.8 : 1) * dt;
  car.v = clamp(car.v, -90, vmax * (offroad ? 0.55 : 1));
  if (offroad) car.v *= Math.exp(-0.8 * dt);

  // steering scales with speed (can't spin in place)
  const dir = (keys.ArrowLeft || keys.KeyA ? -1 : 0) + (keys.ArrowRight || keys.KeyD ? 1 : 0) + steerTouch;
  const grip = clamp(Math.abs(car.v) / vmax, 0, 1);
  car.a += clamp(dir, -1, 1) * st.steer * grip * dt * (car.v < 0 ? -1 : 1);

  // skid marks + sound during hard fast turns
  if (Math.abs(dir) > 0 && Math.abs(car.v) > vmax * 0.65) {
    skids.push({ x: car.x, y: car.y, a: car.a, t: 0 });
    if (skids.length > 220) skids.shift();
    if (Math.random() < 0.1) sfx.skid();
  }

  // move with collision (walls & buildings & water bounce)
  const nx = car.x + Math.cos(car.a) * car.v * dt;
  const ny = car.y + Math.sin(car.a) * car.v * dt;
  const tile = tileAt(nx, ny);
  if (tile === 1 || tile === 3) {
    if (Math.abs(car.v) > 120) { shake = Math.min(12, shake + 6); sfx.crash(); spawnParts(car.x, car.y, 8, 30); }
    car.v *= -0.3;
  } else {
    car.x = nx; car.y = ny;
  }
  car.x = clamp(car.x, T * 0.5, WORLD_W - T * 0.5);
  car.y = clamp(car.y, T * 0.5, WORLD_H - T * 0.5);
  engineUpdate(car.v, st.vmax, boosting);
}

/* ============================================================
   SECTION 6 — MISSIONS
   ============================================================ */
function spawnJobOffer() {
  const p = randomRoadPoint(car.x, car.y, 6);
  job = { phase: 'pickup', x: p.x, y: p.y };
}
function acceptJob() {
  const type = JOB_TYPES[rndi(0, JOB_TYPES.length - 1)];
  const targets = [];
  let fx = car.x, fy = car.y, dist = 0;
  for (let i = 0; i < type.targets; i++) {
    const p = randomRoadPoint(fx, fy, 7);
    dist += Math.abs(p.x - fx) + Math.abs(p.y - fy);
    targets.push(p);
    fx = p.x; fy = p.y;
  }
  const st = carStats();
  const est = dist / (st.vmax * 0.45);
  const timeMax = Math.max(8, est * Math.max(1.05, 1.5 - level * 0.04) + 4);
  job = {
    phase: 'run', type, targets, ti: 0,
    timer: timeMax, timeMax,
    reward: Math.round((40 + dist / 45) * (1 + streak * 0.12)),
  };
  banner = { main: type.name, sub: type.flavor + ' · $' + job.reward, t: 0, hue: type.hue };
  sfx.pickup();
}
function updateJob(dt) {
  if (!job) { spawnJobOffer(); return; }
  if (job.phase === 'pickup') {
    if (Math.hypot(car.x - job.x, car.y - job.y) < T * 0.9) acceptJob();
    return;
  }
  job.timer -= dt;
  const tgt = job.targets[job.ti];
  if (Math.hypot(car.x - tgt.x, car.y - tgt.y) < T * 0.9) {
    job.ti++;
    if (job.ti >= job.targets.length) {
      const bonus = Math.round(job.timer * 2);
      cash += job.reward + bonus;
      jobsDone++; totalJobs++; streak++; level++;
      if (streak > bestStreak) bestStreak = streak;
      addFloat(W / 2, H * 0.35, '+$' + (job.reward + bonus) + (bonus > 0 ? ' (+' + bonus + ' fast!)' : ''), 50);
      banner = { main: 'DELIVERED!', sub: 'streak ×' + streak, t: 0, hue: 130 };
      spawnParts(car.x, car.y, 24, 50);
      sfx.deliver();
      saveProfile();
      job = null;
    } else {
      addFloat(W / 2, H * 0.35, 'checkpoint ' + job.ti + '/' + job.targets.length, 320);
      sfx.check();
    }
    return;
  }
  if (job.timer <= 0) {
    banner = { main: 'TOO LATE', sub: streak > 0 ? 'streak lost' : 'try the next one', t: 0, hue: 5 };
    streak = 0;
    sfx.fail();
    job = null;
  }
}
function currentTarget() {
  if (!job) return null;
  return job.phase === 'pickup' ? { x: job.x, y: job.y, hue: 190, label: 'JOB' }
    : { x: job.targets[job.ti].x, y: job.targets[job.ti].y, hue: job.type.hue, label: job.type.targets > 1 ? 'CHECK ' + (job.ti + 1) : 'DROP' };
}

/* ============================================================
   SECTION 7 — RUN LIFECYCLE & EFFECTS
   ============================================================ */
function startRun() {
  genCity();
  resetCar();
  skids = []; parts = []; floats = [];
  banner = { main: 'SHIFT STARTED', sub: 'drive to the flashing JOB marker', t: 0, hue: 190 };
  jobsDone = 0; streak = 0; level = totalJobs;   // difficulty carries over gently
  job = null;
  state = 'playing';
  engineStart();
  sfx.pickup();
}
function addFloat(x, y, txt, hue) {
  if (floats.length > 10) floats.shift();
  floats.push({ x, y, txt, hue, t: 0, life: 1.6 });
}
function spawnParts(x, y, n, hue) {
  for (let i = 0; i < n && parts.length < 150; i++) {
    const a = rnd(0, TAU), s = rnd(30, 130);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rnd(0.3, 0.8), hue });
  }
}

/* ============================================================
   SECTION 8 — INPUT
   ============================================================ */
const keys = {};
let steerTouch = 0, steerId = null, turboId = null;
const btns = {};
function hit(b, x, y) { return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

function pointAt(x, y) {
  audioInit();
  if (state === 'title') {
    if (hit(btns.garage, x, y)) { state = 'garage'; sfx.select(); return; }
    startRun();
    return;
  }
  if (state === 'garage') {
    for (let i = 0; i < UPGRADES.length; i++) {
      if (hit(btns['up' + i], x, y)) { buyUpgrade(UPGRADES[i].id); return; }
    }
    if (hit(btns.close, x, y) || true) { state = statePrev; sfx.select(); }
    return;
  }
  if (state === 'paused') { state = 'playing'; lastFrame = performance.now(); return; }
  if (hit(btns.mute, x, y)) { setMuted(!muted); return; }
  if (hit(btns.garageIn, x, y)) {
    if (job && job.phase === 'run') { sfx.deny(); addFloat(W / 2, H * 0.3, 'finish the job first!', 5); }
    else { statePrev = 'playing'; state = 'garage'; sfx.select(); }
    return;
  }
  if (hit(btns.turbo, x, y)) { turboOn = true; if (turbo > 0.2) sfx.turbo(); return; }
  // otherwise: steering zones
  steerTouch = x < W / 2 ? -1 : 1;
}
let statePrev = 'title';

function buyUpgrade(id) {
  const u = UPGRADES.find((x) => x.id === id);
  const lv = up[id];
  if (lv >= 3) { sfx.deny(); return; }
  const cost = u.costs[lv];
  if (cash < cost) { sfx.deny(); return; }
  cash -= cost;
  up[id]++;
  saveProfile();
  sfx.buy();
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const wasSteer = steerTouch, wasTurbo = turboOn;
    pointAt(t.clientX, t.clientY);
    if (state === 'playing' && steerTouch !== wasSteer) steerId = t.identifier;
    if (state === 'playing' && turboOn && !wasTurbo) turboId = t.identifier;
  }
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === steerId) steerTouch = t.clientX < W / 2 ? -1 : 1;
  }
}, { passive: false });
function endTouch(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const id = e.changedTouches[i].identifier;
    if (id === steerId) { steerTouch = 0; steerId = null; }
    if (id === turboId) { turboOn = false; turboId = null; }
  }
  if (e.touches && e.touches.length === 0) { turboOn = false; steerId = null; steerTouch = 0; }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);
canvas.addEventListener('mousedown', (e) => { if (state !== 'playing') pointAt(e.clientX, e.clientY); else pointAt(e.clientX, e.clientY); });
addEventListener('mouseup', () => { turboOn = false; steerTouch = 0; });

addEventListener('keydown', (e) => {
  if (e.repeat) return;
  keys[e.code] = true;
  audioInit();
  if (e.code === 'KeyM') { setMuted(!muted); return; }
  if (state === 'title' || state === 'paused') { if (state === 'title') startRun(); else { state = 'playing'; lastFrame = performance.now(); } return; }
  if (state === 'garage') { if (e.code === 'Escape' || e.code === 'KeyG') { state = statePrev; } return; }
  if (e.code === 'Space') { e.preventDefault(); turboOn = true; if (turbo > 0.2) sfx.turbo(); }
  if (e.code === 'KeyG') {
    if (job && job.phase === 'run') sfx.deny();
    else { statePrev = 'playing'; state = 'garage'; sfx.select(); }
  }
});
addEventListener('keyup', (e) => {
  keys[e.code] = false;
  if (e.code === 'Space') turboOn = false;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') state = 'paused';
  lastFrame = 0;
});

/* ============================================================
   SECTION 9 — RENDER
   ============================================================ */
function render() {
  ctx.fillStyle = '#15171c';
  ctx.fillRect(0, 0, W, H);
  if (map && car) {
    ctx.save();
    if (shake > 0.3) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
    renderWorld();
    ctx.restore();
    renderHUD();
  }
  renderFloats();
  renderBanner();
  if (state === 'title') renderTitle();
  if (state === 'garage') renderGarage();
  if (state === 'paused') renderPaused();
}

function renderWorld() {
  const lookX = Math.cos(car.a) * Math.min(120, Math.abs(car.v) * 0.35);
  const lookY = Math.sin(car.a) * Math.min(120, Math.abs(car.v) * 0.35);
  camX = clamp(car.x + lookX - W / 2, 0, Math.max(0, WORLD_W - W));
  camY = clamp(car.y + lookY - H / 2, 0, Math.max(0, WORLD_H - H));

  const c0 = Math.floor(camX / T), c1 = Math.ceil((camX + W) / T);
  const r0 = Math.floor(camY / T), r1 = Math.ceil((camY + H) / T);
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      if (r < 0 || r >= MROWS || c < 0 || c >= MCOLS) continue;
      const x = c * T - camX, y = r * T - camY;
      const t = map[r][c];
      if (t === 0) {
        ctx.fillStyle = '#2a2d33';
        ctx.fillRect(x, y, T + 0.5, T + 0.5);
        // lane dashes on straight roads
        ctx.fillStyle = 'rgba(240,220,140,0.28)';
        const horiz = r % BLOCK === 0 || r === MROWS - 1;
        const vert = c % BLOCK === 0 || c === MCOLS - 1;
        if (horiz && !vert) ctx.fillRect(x + T * 0.2, y + T * 0.47, T * 0.35, 2.5);
        if (vert && !horiz) ctx.fillRect(x + T * 0.47, y + T * 0.2, 2.5, T * 0.35);
      } else if (t === 2) {
        ctx.fillStyle = '#274d2c';
        ctx.fillRect(x, y, T + 0.5, T + 0.5);
        ctx.fillStyle = '#3a7040';
        ctx.beginPath(); ctx.arc(x + T * ((r * 7 + c * 13) % 10) / 10, y + T * ((r * 3 + c * 5) % 10) / 10, T * 0.12, 0, TAU); ctx.fill();
      } else if (t === 3) {
        ctx.fillStyle = '#1c4763';
        ctx.fillRect(x, y, T + 0.5, T + 0.5);
        ctx.fillStyle = 'rgba(140,200,235,0.35)';
        ctx.fillRect(x + T * 0.15 + Math.sin(animT * 2 + r + c) * 3, y + T * 0.5, T * 0.4, 2);
      } else {
        // building: block-tinted body + roof highlight
        const hue = blockHue[Math.floor(r / BLOCK)] ? blockHue[Math.floor(r / BLOCK)][Math.floor(c / BLOCK)] || 30 : 30;
        ctx.fillStyle = hsl(hue, 18, 24);
        ctx.fillRect(x, y, T + 0.5, T + 0.5);
        ctx.fillStyle = hsl(hue, 22, 32);
        ctx.fillRect(x + 3, y + 3, T - 6, T - 6);
        ctx.fillStyle = hsl(hue, 25, 40);
        ctx.fillRect(x + 6, y + 6, T * 0.35, T * 0.35);
      }
    }
  }

  // skid marks
  ctx.strokeStyle = 'rgba(20,20,22,0.5)';
  ctx.lineWidth = 3;
  for (const s of skids) {
    const a = 1 - s.t / 4;
    if (a <= 0) continue;
    ctx.globalAlpha = a * 0.6;
    const wx = s.x - camX, wy = s.y - camY;
    ctx.beginPath();
    ctx.moveTo(wx - Math.cos(s.a + 0.5) * 7, wy - Math.sin(s.a + 0.5) * 7);
    ctx.lineTo(wx - Math.cos(s.a - 0.5) * 7, wy - Math.sin(s.a - 0.5) * 7);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // mission markers
  const tgt = currentTarget();
  if (tgt) {
    const mx = tgt.x - camX, my = tgt.y - camY;
    const pulse = 1 + 0.15 * Math.sin(animT * 6);
    ctx.strokeStyle = hsl(tgt.hue, 95, 60);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mx, my, T * 0.45 * pulse, 0, TAU); ctx.stroke();
    ctx.fillStyle = hsl(tgt.hue, 95, 60, 0.25);
    ctx.beginPath(); ctx.arc(mx, my, T * 0.45 * pulse, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = font(11, true);
    ctx.textAlign = 'center';
    ctx.fillText(tgt.label, mx, my - T * 0.6);
  }

  // particles
  for (const p of parts) {
    const a = 1 - p.t / p.life;
    ctx.fillStyle = hsl(p.hue, 90, 62, a);
    ctx.fillRect(p.x - camX - 2, p.y - camY - 2, 4, 4);
  }

  // the car
  const cx = car.x - camX, cy = car.y - camY;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(car.a);
  const boosting = turboOn && turbo > 0;
  if (boosting) {   // exhaust flame
    ctx.fillStyle = hsl(30, 100, 60, 0.8);
    ctx.beginPath();
    ctx.moveTo(-16, -4); ctx.lineTo(-16 - rnd(8, 16), 0); ctx.lineTo(-16, 4);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#101114';
  ctx.fillRect(-13, -9, 6, 4); ctx.fillRect(-13, 5, 6, 4);
  ctx.fillRect(7, -9, 6, 4); ctx.fillRect(7, 5, 6, 4);
  roundedRect(-15, -7, 30, 14, 4);
  ctx.fillStyle = hsl(16, 90, 55);
  ctx.fill();
  ctx.strokeStyle = hsl(16, 90, 75); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#bfe6ff';
  ctx.fillRect(2, -5, 6, 10);
  ctx.restore();
}

function renderHUD() {
  // top bar
  ctx.fillStyle = 'rgba(10,12,16,0.85)';
  ctx.fillRect(0, 0, W, 52);
  ctx.textAlign = 'left';
  ctx.font = font(15, true);
  ctx.fillStyle = hsl(50, 95, 62);
  ctx.fillText('$' + Math.round(cash), 10, 22);
  ctx.fillStyle = '#dff2ff';
  ctx.fillText('jobs ' + totalJobs, 100, 22);
  if (streak > 1) {
    ctx.fillStyle = hsl(130, 85, 60);
    ctx.fillText('streak ×' + streak, 185, 22);
  }
  ctx.font = font(11);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('best streak ' + bestStreak, 10, 42);

  const bw = 52, bh = 24;
  btns.mute = { x: W - bw - 8, y: 6, w: bw, h: bh };
  btns.garageIn = { x: W - bw * 2 - 16, y: 6, w: bw, h: bh };
  for (const [b, label] of [[btns.garageIn, 'garage'], [btns.mute, muted ? '🔇' : '🔊']]) {
    roundedRect(b.x, b.y, b.w, b.h, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#dff2ff'; ctx.font = font(11, true); ctx.textAlign = 'center';
    ctx.fillText(label, b.x + b.w / 2, b.y + 16);
  }

  // mission timer + guide arrow
  const tgt = currentTarget();
  if (job && job.phase === 'run') {
    const frac = clamp(job.timer / job.timeMax, 0, 1);
    const bw2 = Math.min(W * 0.5, 240);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(W / 2 - bw2 / 2, 60, bw2, 8);
    ctx.fillStyle = frac > 0.35 ? hsl(job.type.hue, 90, 60) : hsl(5, 95, 58);
    ctx.fillRect(W / 2 - bw2 / 2, 60, bw2 * frac, 8);
    ctx.textAlign = 'center';
    ctx.font = font(13, true);
    ctx.fillStyle = frac > 0.35 ? '#ffffff' : hsl(5, 95, 68);
    ctx.fillText(Math.ceil(job.timer) + 's', W / 2, 86);
  }
  if (tgt) {
    // edge arrow when target is off-screen; small floating arrow otherwise
    const dx = tgt.x - car.x, dy = tgt.y - car.y;
    const ang = Math.atan2(dy, dx);
    const dist = Math.hypot(dx, dy);
    const sx = tgt.x - camX, sy = tgt.y - camY;
    const onScreen = sx > 30 && sx < W - 30 && sy > 60 && sy < H - 30;
    if (!onScreen) {
      const ax = clamp(W / 2 + Math.cos(ang) * (W / 2 - 40), 40, W - 40);
      const ay = clamp(H / 2 + Math.sin(ang) * (H / 2 - 80), 80, H - 100);
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(ang);
      ctx.fillStyle = hsl(tgt.hue, 95, 60);
      ctx.beginPath();
      ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-4, 0); ctx.lineTo(-8, 9);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.textAlign = 'center';
      ctx.font = font(10, true);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillText(Math.round(dist / T * 10) + 'm', ax, ay + 22);
    }
  }

  // minimap (top-left under HUD)
  if (miniCanvas) {
    const mw = miniCanvas.width, mh = miniCanvas.height;
    const mx = 8, my = 58;
    ctx.globalAlpha = 0.9;
    ctx.drawImage(miniCanvas, mx, my);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.strokeRect(mx - 0.5, my - 0.5, mw + 1, mh + 1);
    const dot = (wx, wy, color, r2) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(mx + wx / WORLD_W * mw, my + wy / WORLD_H * mh, r2, 0, TAU);
      ctx.fill();
    };
    dot(car.x, car.y, '#ffffff', 2.5);
    const tg = currentTarget();
    if (tg && Math.floor(animT * 4) % 2 === 0) dot(tg.x, tg.y, hsl(tg.hue, 95, 60), 3);
  }

  // turbo button + meter (bottom right)
  const tb = { x: W - 74, y: H - 86, w: 64, h: 64 };
  btns.turbo = tb;
  const ready = turbo > 0.2;
  ctx.beginPath();
  ctx.arc(tb.x + 32, tb.y + 32, 32, 0, TAU);
  ctx.fillStyle = turboOn && turbo > 0 ? hsl(30, 100, 55, 0.9) : ready ? 'rgba(255,160,60,0.25)' : 'rgba(255,255,255,0.07)';
  ctx.fill();
  ctx.strokeStyle = ready ? hsl(30, 95, 60) : 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = hsl(30, 95, 60);
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(tb.x + 32, tb.y + 32, 26, -Math.PI / 2, -Math.PI / 2 + turbo * TAU);
  ctx.stroke();
  ctx.fillStyle = turboOn && turbo > 0 ? '#331a00' : 'rgba(255,255,255,0.75)';
  ctx.font = font(12, true);
  ctx.textAlign = 'center';
  ctx.fillText('TURBO', tb.x + 32, tb.y + 37);

  // steering hint zones (fade after first uses)
  if (totalJobs === 0 && jobsDone === 0 && state === 'playing') {
    ctx.font = font(12, true);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.textAlign = 'center';
    ctx.fillText('◀ hold to steer', W * 0.22, H - 40);
    ctx.fillText('hold to steer ▶', W * 0.72, H - 40);
  }
}

function renderFloats() {
  ctx.textAlign = 'center';
  for (const f of floats) {
    const a = 1 - f.t / f.life;
    ctx.font = font(15, true);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(f.txt, f.x + 1, f.y + 1);
    ctx.fillStyle = hsl(f.hue, 95, 68, a);
    ctx.fillText(f.txt, f.x, f.y);
  }
}

function renderBanner() {
  if (!banner || banner.t >= 2.4 || state === 'title') return;
  const tIn = Math.min(1, banner.t / 0.3);
  const ease = 1 - Math.pow(1 - tIn, 3);
  const aOut = banner.t > 1.8 ? 1 - (banner.t - 1.8) / 0.6 : 1;
  ctx.save();
  ctx.globalAlpha = Math.max(0, aOut);
  ctx.translate(W / 2, H * 0.22);
  ctx.scale(0.75 + 0.25 * ease, 0.75 + 0.25 * ease);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.font = font(Math.min(W * 0.08, 34), true);
  ctx.fillText(banner.main, 1.5, 1.5);
  ctx.fillStyle = hsl(banner.hue || 190, 90, 68);
  ctx.fillText(banner.main, 0, 0);
  if (banner.sub) {
    ctx.font = font(13, true);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(banner.sub, 0, 24);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function renderTitle() {
  ctx.fillStyle = 'rgba(8,10,14,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff4e8';
  ctx.font = font(Math.min(W * 0.105, 52), true);
  ctx.fillText('TURBO COURIER', W / 2, H * 0.24);
  ctx.font = font(14);
  ctx.fillStyle = hsl(30, 85, 68);
  ctx.fillText('every second is money', W / 2, H * 0.24 + 34);
  ctx.font = font(13);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  const y = H * 0.42;
  ctx.fillText('drive to the JOB marker to take a mission', W / 2, y);
  ctx.fillText('packages · taxi fares · checkpoint rushes', W / 2, y + 24);
  ctx.fillText('streaks pay more — upgrades are forever', W / 2, y + 48);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('hold left / right side to steer · TURBO to boost', W / 2, y + 82);
  if (totalJobs > 0) {
    ctx.font = font(14, true);
    ctx.fillStyle = hsl(50, 95, 62);
    ctx.fillText('$' + Math.round(cash) + '  ·  ' + totalJobs + ' deliveries  ·  best streak ' + bestStreak, W / 2, y + 116);
  }
  // garage button on title
  const bw2 = Math.min(200, W * 0.5);
  btns.garage = { x: W / 2 - bw2 / 2, y: H * 0.68, w: bw2, h: 46 };
  roundedRect(btns.garage.x, btns.garage.y, bw2, 46, 12);
  ctx.fillStyle = 'rgba(255,170,70,0.15)'; ctx.fill();
  ctx.strokeStyle = hsl(30, 85, 58); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ffe8cc'; ctx.font = font(15, true);
  ctx.fillText('GARAGE', W / 2, btns.garage.y + 29);
  const a = 0.55 + 0.45 * Math.sin(performance.now() * 0.005);
  ctx.font = font(15, true);
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.fillText('TAP ANYWHERE ELSE TO DRIVE', W / 2, H * 0.82);
}

function renderGarage() {
  ctx.fillStyle = 'rgba(8,10,14,0.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe8cc';
  ctx.font = font(28, true);
  ctx.fillText('GARAGE', W / 2, H * 0.14);
  ctx.font = font(14, true);
  ctx.fillStyle = hsl(50, 95, 62);
  ctx.fillText('$' + Math.round(cash), W / 2, H * 0.14 + 26);
  const cw = Math.min(W * 0.84, 340), ch = 74;
  const x = W / 2 - cw / 2;
  for (let i = 0; i < UPGRADES.length; i++) {
    const u = UPGRADES[i];
    const lv = up[u.id];
    const y = H * 0.24 + i * (ch + 14);
    btns['up' + i] = { x, y, w: cw, h: ch };
    const maxed = lv >= 3;
    const cost = maxed ? 0 : u.costs[lv];
    const afford = !maxed && cash >= cost;
    roundedRect(x, y, cw, ch, 12);
    ctx.fillStyle = afford ? 'rgba(255,170,70,0.12)' : 'rgba(255,255,255,0.05)';
    ctx.fill();
    ctx.strokeStyle = afford ? hsl(30, 85, 58) : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1.5; ctx.stroke();
    ctx.textAlign = 'left';
    ctx.font = font(16, true);
    ctx.fillStyle = '#fff4e8';
    ctx.fillText(u.name, x + 16, y + 28);
    ctx.font = font(11);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(u.desc, x + 16, y + 46);
    // level pips
    for (let p = 0; p < 3; p++) {
      ctx.fillStyle = p < lv ? hsl(30, 95, 60) : 'rgba(255,255,255,0.15)';
      ctx.fillRect(x + 16 + p * 20, y + 56, 14, 6);
    }
    ctx.textAlign = 'right';
    ctx.font = font(15, true);
    ctx.fillStyle = maxed ? hsl(130, 80, 60) : afford ? hsl(50, 95, 62) : hsl(5, 80, 58);
    ctx.fillText(maxed ? 'MAX' : '$' + cost, x + cw - 16, y + ch / 2 + 6);
  }
  btns.close = { x: W / 2 - 80, y: H * 0.24 + 3 * (ch + 14) + 10, w: 160, h: 44 };
  roundedRect(btns.close.x, btns.close.y, 160, 44, 12);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff'; ctx.font = font(14, true);
  ctx.fillText('BACK', W / 2, btns.close.y + 28);
}

function renderPaused() {
  ctx.fillStyle = 'rgba(8,10,14,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff4e8';
  ctx.font = font(30, true);
  ctx.fillText('PAUSED', W / 2, H * 0.42);
  const a = 0.55 + 0.45 * Math.sin(performance.now() * 0.005);
  ctx.font = font(14, true);
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.fillText('TAP OR PRESS ANY KEY', W / 2, H * 0.52);
}

/* ============================================================
   SECTION 10 — MAIN LOOP, RESIZE, BOOT
   ============================================================ */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.round(window.innerWidth) || 0;
  H = Math.round(window.innerHeight) || 0;
  if (W < 2 || H < 2) { W = Math.max(W, 2); H = Math.max(H, 2); setTimeout(resize, 100); }
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

function frame(now) {
  const dt = Math.min(0.04, lastFrame ? (now - lastFrame) / 1000 : 0.016);
  lastFrame = now;
  animT += dt;
  if (state === 'playing') {
    updateCar(dt);
    updateJob(dt);
    for (let i = skids.length - 1; i >= 0; i--) { skids[i].t += dt; if (skids[i].t > 4) skids.splice(i, 1); }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.t += dt; f.y -= 18 * dt;
      if (f.t >= f.life) floats.splice(i, 1);
    }
    if (banner) banner.t += dt;
    shake *= Math.exp(-6 * dt);
  } else if (engGain) engGain.gain.value = 0;
  render();
  requestAnimationFrame(frame);
}

resize();
loadProfile();
genCity();
resetCar();
skids = []; parts = []; floats = [];
banner = { main: '', sub: '', t: 99 };
jobsDone = 0; streak = 0; level = 0;
state = 'title';
requestAnimationFrame(frame);

const bootEl = document.getElementById('boot');
if (bootEl) bootEl.parentNode.removeChild(bootEl);
</script>
